# Configuración del portafolio (Jekyll). Aquí se edita la tarjeta lateral.
# Después de cambiar este archivo, GitHub tarda 1-2 minutos en actualizar la página.

title: "Tecnologías Emergentes"
description: "Portafolio de prácticas y proyecto final · Otoño 2026"
url: "https://gabriel-coronad.github.io"
baseurl: "/tecnologias-emergentes"
lang: "es"

# Tarjeta lateral
tarjeta:
  nombre: "Gabriel Adad Coronado Placeres"
  etiqueta: "Tecnologías Emergentes"
  datos:
    - titulo: "Carrera"
      valor: "Ing. en Tecnologías de Cómputo y Telecomunicaciones"
      icono: "carrera"
    - titulo: "Universidad"
      valor: "Universidad Iberoamericana"
      icono: "universidad"
    - titulo: "Materia"
      valor: "Tecnologías Emergentes · Otoño 2026"
      icono: "materia"
    - titulo: "Profesores"
      valor: "Mtro. Joel Arango Ramírez<br>Mtro. Christopher Rodríguez Avitúa"
      icono: "profesores"

# Menú de arriba
menu:
  - titulo: "Inicio"
    url: /
    id: inicio
  - titulo: "Prácticas"
    url: /practicas/
    id: practicas
  - titulo: "Proyecto final"
    url: /proyecto-final/
    id: proyecto

# Cada práctica (carpeta dentro de practicas/) usa el diseño de reporte
defaults:
  - scope:
      path: "practicas"
    values:
      layout: practica
      menu_activo: practicas

exclude:
  - README.md
  - LICENCIA-vCard.txt
